function morph(a,b){const ac=a.childNodes,bc=b.childNodes;
 for(let i=0;i<bc.length;i++){const n=bc[i],o=ac[i];
  if(!o){a.appendChild(n.cloneNode(true));continue}
  if(o.nodeType!==n.nodeType||o.nodeName!==n.nodeName){a.replaceChild(n.cloneNode(true),o);continue}
  if(o.nodeType!==1){if(o.nodeValue!==n.nodeValue)o.nodeValue=n.nodeValue;continue}
  if(o.isEqualNode(n))continue;
  for(const at of Array.from(o.attributes))if(!n.hasAttribute(at.name))o.removeAttribute(at.name);
  for(const at of Array.from(n.attributes))if(o.getAttribute(at.name)!==at.value)o.setAttribute(at.name,at.value);
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(o.nodeName))continue;
  morph(o,n)}
 while(ac.length>bc.length)a.removeChild(a.lastChild)}

/* ================= BẢO VỆ VƯƠNG QUỐC – lõi luật chơi (dùng chung cho người chơi & admin) =================
   Mọi hành động (cộng khiên/kiếm, tấn công) được ghi nối đuôi vào  gold/moves/<mã>  (Firebase POST).
   Mọi máy "phát lại" cùng một nhật ký theo thứ tự khoá -> ra cùng một kết quả, không cần máy chủ trọng tài. */
const KN=[['Sư Tử','🦁','#f59e0b'],['Rồng Lửa','🐲','#ef4444'],['Phượng Hoàng','🔥','#f97316'],['Kỳ Lân','🦄','#a855f7'],['Đại Dương','🌊','#0ea5e9'],['Sói Bạc','🐺','#64748b'],['Đại Bàng','🦅','#b45309'],['Hổ Vàng','🐯','#ca8a04'],['Gấu Xanh','🐻','#16a34a'],['Cá Mập','🦈','#0891b2'],['Báo Đen','🐆','#334155'],['Cú Đêm','🦉','#7c3aed'],['Voi Thép','🐘','#6b7280'],['Cá Voi','🐳','#2563eb'],['Bọ Cạp','🦂','#be123c'],['Cua Đỏ','🦀','#dc2626']];
const RANK_MD=['🥇','🥈','🥉'];
function hs(s){let h=2166136261;s=String(s);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
/* Chia đội: mỗi đội `size` người; số người dư (< size) được chia thêm 1 người cho các đội CUỐI. VD 46 người, 4/đội -> 11 đội: 9 đội 4 người + 2 đội 5 người */
function teamSizes(P,size){size=Math.max(1,size|0||4);const T=Math.min(P,Math.max(2,Math.floor(P/size))),b=Math.floor(P/T),x=P%T;return Array.from({length:T},(_,i)=>b+(i>=T-x?1:0))}
function mkGroups(ids,size){if(ids.length<2)return null;const o=shuffle(ids),z=teamSizes(o.length,size),g=[];let k=0;z.forEach(n=>{g.push(o.slice(k,k+n));k+=n});return g}
function mkTeamsFrom(g){const nm=shuffle([...KN.keys()]),out={};g.forEach((m,i)=>{const w=nm[i%nm.length],lap=i>=KN.length?' '+(Math.floor(i/KN.length)+1):'';out['t'+i]={id:'t'+i,name:'Vương quốc '+KN[w][0]+lap,em:KN[w][1],col:KN[w][2],m}});return out}
function mkTeams(ids,size){const g=mkGroups(ids,size);return g&&mkTeamsFrom(g)}
const TEAML=S_=>Object.values((S_&&S_.teams)||{}).map(t=>({...t,m:[].concat(t.m||[])})).sort((a,b)=>a.id<b.id?-1:1);
/* Phát lại nhật ký -> trạng thái trò chơi */
function replay(S_,mv){const L=TEAML(S_),ini=0,TS={},loc={},home={},log=[];let over=false;
 L.forEach(t=>{TS[t.id]={id:t.id,def:ini,atk:ini,out:false};t.m.forEach(p=>{home[p]=t.id;loc[p]=t.id})});
 const ids=Object.keys(home).sort(),castle=t=>ids.filter(p=>home[p]==t&&loc[p]==t),jail=t=>ids.filter(p=>loc[p]==t&&home[p]!=t),alive=()=>L.filter(t=>!TS[t.id].out);
 for(const[k,v]of mv){if(over)break;if(!v||typeof v!='object')continue;const A=home[v.p];if(!A||TS[A].out)continue;const a=TS[A];
  if(v.k=='d'||v.k=='a'){const n=v.n==2?2:1;a[v.k=='d'?'def':'atk']+=n;log.push({key:k,kind:v.k,A,p:v.p,n});continue}
  if(v.k!='x')continue;const to=v.to,b=TS[to];if(!b||b.out||to==A||a.atk<1)continue;
  a.atk--;const r=hs(k),e={key:k,kind:'block',A,B:to,p:v.p};
  if(b.def>0)b.def--;
  else{const jl=jail(to);
   if(jl.length){const q=jl[r%jl.length];loc[q]=home[q];e.kind='free';e.q=q;a.atk++}
   else{const cs=castle(to);if(!cs.length)continue;const q=cs[r%cs.length];loc[q]=A;e.kind='cap';e.q=q;a.atk++;b.def+=2;
    if(!castle(to).length){b.out=true;b.def=0;jail(to).forEach(z=>loc[z]=home[z]);e.kind='fall'}}}
  log.push(e);if(alive().length<=1)over=true}
 return{TS,loc,home,log,over,teams:L,ids,castle,jail}}
function rankT(R){return R.teams.map(t=>({t,s:R.TS[t.id],c:R.castle(t.id).length,j:R.jail(t.id).length})).sort((a,b)=>(a.s.out-b.s.out)||(b.c-a.c)||(b.j-a.j)||((b.s.def+b.s.atk)-(a.s.def+a.s.atk))||(a.t.id<b.t.id?-1:1))}

<li>🛡️⚔️ Đội có <b>lượt phòng thủ</b> và <b>lượt tấn công</b> (lúc đầu <b>mỗi đội đều bằng 0</b>, phải trả lời đúng để kiếm).</li>
<li>❓ Trả lời <b>đúng</b> để được chọn: <b>🛡️ Khiên</b> (+1 phòng thủ) hoặc <b>⚔️ Kiếm</b> (+1 tấn công). Trả lời sai thì không được thưởng và <b>bắt buộc làm lại đúng câu đó</b> (đáp án được xáo lại) cho tới khi đúng mới được đi tiếp; làm lại không tính điểm.</li>
<li>⚔️ Có ít nhất 1 lượt tấn công là được <b>Tấn công</b>: chọn một vương quốc khác (chỉ thấy tên và số nhân vật). Mỗi lần tấn công mất 1 lượt tấn công.</li>
<li>🛡️ Bị tấn công mà còn phòng thủ: mất 1 lượt phòng thủ, không ai bị bắt.</li>
<li>💥 Bị tấn công mà phòng thủ = 0: nếu đội đó đang giữ <b>tù binh</b> thì tù binh được <b>giải cứu trước</b> (về lại thành của họ); hết tù binh mới bắt <b>1 nhân vật</b> của đội đó đem về nhà giam.</li>
<li>💀 Đội bị bắt hết nhân vật sẽ <b>thua</b>. Đội cuối cùng còn đứng vững thắng. Hết giờ thì xếp hạng theo số nhân vật còn trong thành, rồi số tù binh.</li>
</ul><b>✨ Luật bổ sung cho vui:</b><ul style="padding-left:18px;margin:6px 0">
<li>🔥 <b>Combo:</b> trả lời đúng 3 câu liên tiếp, phần thưởng của câu thứ 3 được <b>gấp đôi</b> (+2).</li>
<li>🎯 <b>Đòn thắng:</b> đánh trúng (bắt người hoặc giải cứu) được hoàn lại 1 lượt tấn công.</li>
<li>🧱 <b>Gia cố thành:</b> đội vừa bị bắt 1 người được tặng thêm 2 lượt phòng thủ để gượng dậy.</li>
<li>🤝 <b>Bị giam vẫn chơi:</b> bạn bị bắt vẫn trả lời câu hỏi để giúp đội kiếm khiên và kiếm; đồng đội đánh vào đội đang giam em để cứu em!</li>
</ul></div><button onclick="close_()" style="width:100%">Đã hiểu ▶</button>`;

const TSV=()=>2,INV=()=>0;
function prevTeams(n,size){if(n<2)return 'Cần ít nhất 2 người chơi.';const z=teamSizes(n,size),c={};z.forEach(v=>c[v]=(c[v]|0)+1);return `→ ${z.length} đội: `+Object.keys(c).sort((a,b)=>a-b).map(k=>c[k]+' đội × '+k+' người').join(' + ')}

function renderPlan(){const pl=window.PLAN,P=window.CP||{},s=window.CS||{};if(!pl)return;
 const opts=i=>pl.g.map((_,j)=>`<option value="${j}"${j==i?' selected':''}>Đội ${j+1}</option>`).join('');

 app(`<div class="card" style="text-align:center"><div class="hint">${esc(s.title||'')} · 👥 ${Object.keys(P).length} người · ${pl.g.length} đội</div><div class="code">${CODE}</div><p class="hint">Gợi ý chia đội ngẫu nhiên: ${prevTeams(Object.keys(P).length,pl.size)}. Đổi đội từng bạn ở ô chọn, hoặc bấm 🔀 Xáo lại.</p><div class="row" style="justify-content:center"><label>👥 Người/đội <input id="plsz" type="number" min="1" max="20" value="${pl.size}" style="width:64px"></label><button class="alt" onclick="plShuf()">🔀 Xáo lại</button><button onclick="startG()" style="font-size:18px">✔ Xác nhận &amp; bắt đầu</button><button class="alt" onclick="plBack()">← Quay lại</button></div><div style="max-height:52vh;overflow:auto">${box}</div></div>`)}
function teamTbl(s,P){if(!s||!s.teams)return '';const R=replay(s,mvList());return `<h3>🏰 Kết quả các vương quốc</h3><table class="sb">${TEAMHEAD}${teamRows(s,R,P,null)}</table>`}
async function ctl(code){if(!code)return;CODE=code;clearInterval(CT);let first=true,QL=null;window.ENDW=null;
 const draw=async()=>{let s,P,L;try{s=await fb(G('sessions/'+code));if(!s)throw Error('Không tìm thấy mã '+code);P=(await fb(G('players/'+code)))||{}}catch(e){if(first){clearInterval(CT);app(`<div class="card"><p class="err">${esc(e.message)}</p><button onclick="home()">Quay lại</button></div>`)}return}first=false;
  const KK=s.kicked||{};Object.entries(P).forEach(([id,v])=>{if(isKk(KK,id,v))fb(G('players/'+code+'/'+id),'DELETE').catch(()=>{})});P=Object.fromEntries(Object.entries(P).filter(([id,v])=>v&&v.name&&!isKk(KK,id,v)));window.CP=P;
  if(window.PLANON){if(s.status=='waiting'){planSync(P);return}window.PLANON=false;window.PLAN=null}
  const run=s.status=='running',R0=Object.entries(P).map(([id,v])=>({id,...v}));let R=null,mvErr='';

  const end=s.status=='ended'||(run&&now()>=s.end)||!!(R&&R.over);
  if(end&&s.status!='ended'&&window.ENDW!=code){window.ENDW=code;fb(G('sessions/'+code),'PATCH',{status:'ended'}).catch(()=>{})}
  const cv={ini:($('#ini')||{}).value,dur:($('#dur')||{}).value,tsz:($('#tsz')||{}).value};let body;
  if(end){clearInterval(CT);try{L=(await fb(G('logs/'+code)))||{};QL=QL||await qLoad(code)}catch(e){L={};QL=QL||[]}
   body=R?`<div class="resw">${sumK(s,P,L,QL,null,R)}</div>`:'<h2>Kết thúc</h2>';body+=`<div class="row" style="justify-content:center"><button onclick="rep('${code}')">📊 Báo cáo đầy đủ</button></div>`}
  else if(run&&R){const fe=R.log.filter(e=>e.kind!='d'&&e.kind!='a').slice(-10).reverse();
   body=`<div class="row"><span class="qc">⏱ còn <b id="tm">${fmtT(s.end-now())}</b></span><span class="qc">➕ đã cộng ${s.extra|0} phút</span><button onclick="addMin()">➕ 1 phút</button><button class="alt" style="background:#ef4444" onclick="endNow()">⏹ Kết thúc</button></div>${mvErr?`<p class="err">⚠️ ${esc(mvErr)}</p>`:''}<table class="sb tt">${TEAMHEAD}${teamRows(s,R,P,null)}</table><div class="feed" style="text-align:left"><b>📣 Diễn biến</b>${fe.length?fe.map(e=>`<div>${evText(e,s,P)}</div>`).join(''):'<div class="hint">Chưa có trận đánh nào…</div>'}</div>`}
  else body=`<div class="row"><label>👥 Người/đội <input id="tsz" type="number" min="1" max="20" value="${cv.tsz||4}" oninput="updPrev()" style="width:64px"></label><label>⏱ Phút <input id="dur" type="number" min="1" value="${cv.dur||s.dur}" style="width:70px"></label><button onclick="startG()" style="font-size:20px">🎲 Bắt đầu &amp; chia ngẫu nhiên</button><button class="alt" onclick="openPlan()" style="font-size:18px">✋ Admin chia đội</button>${INF("Khi bấm Bắt đầu, máy tự chia đội ngẫu nhiên theo số người đang có trong phòng (mỗi đội đúng số người đã đặt; người dư được chia thêm vào các đội cuối, VD 46 người, 4 người/đội = 11 đội, 2 đội cuối có 5 người). Hoặc bấm ✋ Admin chia đội để xem gợi ý và tự chuyển người giữa các đội. Người vào sau khi đã bắt đầu sẽ không được tham gia.")}</div><p class="hint" id="tprev">${prevTeams(R0.length,cv.tsz||4)}</p>${R0.map(r=>`<span class="chip">${avH(r.av)} ${esc(r.name)} <b title="Bấm để loại ${esc(r.name)} khỏi phòng" style="color:#dc2626;margin-left:6px;cursor:pointer" onclick="kickAsk('${r.id}',this)">✕</b></span>`).join('')||'<i>Chưa có ai vào</i>'}`;
  appS(`<div class="card" style="text-align:center"><div class="hint">${esc(s.title)} · ${s.nq} câu · 👥 ${R0.length} người${s.teams?' · '+Object.keys(s.teams).length+' đội':''}</div><div class="code">${code}</div>${body}<div class="row" style="justify-content:center"><button class="alt" onclick="clearInterval(CT);home()">← Quay lại</button><button class="alt" onclick="clearInterval(CT);rep('${code}')">📊 Báo cáo</button></div></div>`,'ctl:'+code+':'+(end?'end':run?'run':'wait'));window.CS=s};
 CT=setInterval(draw,2500);window.CDRAW=draw;draw();clearInterval(window.CTT);window.CTT=setInterval(()=>{const t=$('#tm');if(t&&window.CS&&CS.status=='running')t.textContent=fmtT(CS.end-now())},1000)}
async function startG(){const pl=window.PLANON?window.PLAN:null,d=Math.max(1,+($('#dur')||{}).value||(pl&&pl.dur)||15),ts=Math.max(1,+($('#tsz')||{}).value||(pl&&pl.size)||4),ini=0,t=now();
 const P0=(await fb(G('players/'+CODE)))||{},KK=(window.CS&&CS.kicked)||{},ids=Object.entries(P0).filter(([id,v])=>v&&v.name&&!isKk(KK,id,v)).map(e=>e[0]);let teams;
 if(pl){const ok=new Set(ids),g=pl.g.map(a=>a.filter(x=>ok.has(x))).filter(a=>a.length),have=new Set(g.flat()),rest=ids.filter(x=>!have.has(x));if(rest.length)return alert('Còn '+rest.length+' người chưa có đội, hãy bấm 🔀 Xáo lại.');if(g.length<2)return alert('Cần ít nhất 2 đội.');teams=mkTeamsFrom(g)}else teams=mkTeams(ids,ts);
 if(!teams)return alert('Cần ít nhất 2 người chơi để bắt đầu.');if(Object.keys(teams).length<2)return alert('Cần ít nhất 2 vương quốc: hãy giảm số người/đội.');
 try{await fb(G('moves/'+CODE),'DELETE')}catch(e){}window.ENDW=null;window.PLANON=false;window.PLAN=null;
 await fb(G('sessions/'+CODE),'PATCH',{status:'running',dur:d,ts,ini,teams,start:t,end:t+d*60000});MV=new Map();LASTK='';MVC=''}

login();

</script><script id="vk-js">
(function(){var T=null,OKA='',sh=true,sy=false,K=null,ADJ=null,CH=null,R=['1234567890','QWERTYUIOP','ASDFGHJKL','ZXCVBNM'],NM={jN:1,pname:1,nm:1,hwn:1},FULL={aP:1};
function A(c){return String(c).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function el(){return T?document.getElementById(T):null}
function isNm(){return !!NM[T]}
function isFull(){return !!FULL[T]}
function build(){K=document.createElement('div');K.id='vk';K.addEventListener('mousedown',function(e){e.preventDefault()});
 K.addEventListener('click',function(e){var b=e.target.closest('button');if(b)key(b.getAttribute('data-k'))});document.body.appendChild(K)}
function kb(c,cls){return '<button'+(cls?' class="'+cls+'"':'')+' data-k="'+A(c)+'">'+A(c)+'</button>'}
function drawFull(){var L=sy?['!@#$%^&*()','-_=+[]{}|\\',';:\'",.<>/?','~`']:['1234567890','qwertyuiop','asdfghjkl','zxcvbnm'];
 var up=function(c){return !sy&&sh&&/[a-z]/.test(c)?c.toUpperCase():c};
 var h=L.map(function(r,i){var s='<div class="vr">';if(i==3&&!sy)s+='<button class="fn'+(sh?' on':'')+'" data-k="SH">⇧</button>';
  s+=r.split('').map(function(c){return kb(up(c),i==0&&!sy?'num':(i==3&&sy?'hf':''))}).join('');if(i==3)s+='<button class="fn" data-k="BS">⌫</button>';return s+'</div>'}).join('');
 h+='<div class="vr"><button class="fn" data-k="SY">'+(sy?'abc':'#+=')+'</button>'+kb('@')+kb('.')+kb('_')+kb('-')+'<button class="sp" data-k=" ">␣</button><button class="cl" data-k="CL">✖</button><button class="ok" data-k="OK">✔ Xong</button></div>';
 K.className='full';K.innerHTML=h}
function draw(){if(isFull())return drawFull();K.className='';var n=isNm(),lc=function(c){return /[A-Z]/.test(c)&&n&&!sh?c.toLowerCase():c};
 K.innerHTML=R.map(function(r,i){return '<div class="vr">'+(i==3&&n?'<button class="fn'+(sh?' on':'')+'" data-k="SH">⇧</button>':'')+r.split('').map(function(c){return '<button'+(i==0?' class="num"':'')+' data-k="'+lc(c)+'">'+lc(c)+'</button>'}).join('')+(i==3?'<button class="fn" data-k="BS">⌫</button>':'')+'</div>'}).join('')+
 '<div class="vr"><button class="cl" data-k="CL">✖ Đóng</button>'+(n?'<button class="sp" data-k=" ">␣ Dấu cách</button>':'')+'<button class="ok" data-k="OK">✔ Xong</button></div>'}

 if(k=='CL')return close();if(k=='SH'){sh=!sh;return draw()}if(k=='SY'){sy=!sy;return draw()}
 if(k=='BS'){e.value=e.value.slice(0,-1);return ev(e)}
 if(k=='OK'){var id=T,a=OKA;close();if(a){try{new Function(a)()}catch(x){}}else if(id=='code'||id=='cd'){var b=document.querySelector('[data-act="join-room"],[data-a="join"]');if(b)b.click()}return}
 var m=+e.getAttribute('maxlength')||99;if(e.value.length>=m)return;e.value+=k;ev(e)}

function close(){if(K)K.style.display='none';document.body.style.paddingBottom='';unadj();clearInterval(CH);var e=el();if(e)e.removeAttribute('inputmode');T=null;OKA=''}
function open(id,ok){var e=document.getElementById(id);if(!e)return;if(!K)build();if(T==id)return close();var o=el();if(o)o.removeAttribute('inputmode');T=id;OKA=ok||'';sh=isFull()?false:(isNm()?!e.value:true);sy=false;e.setAttribute('inputmode','none');e.blur();draw();K.style.display='block';document.body.style.paddingBottom=K.offsetHeight+'px';adjust(e);clearInterval(CH);CH=setInterval(function(){if(T&&!document.getElementById(T))close()},400);setTimeout(function(){e.scrollIntoView({block:'center',behavior:'smooth'})},50)}
